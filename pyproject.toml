[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisti-microfinance-analytics"
version = "0.0.0"
description = "Microfinance analytics for Bangladesh: real MRA institution-level data plus a calibrated synthetic loan book."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Khalilur Rahman Ridoy Khan" }]
dependencies = ["pdfplumber>=0.11", "pandas>=2.2", "numpy>=1.26", "matplotlib>=3.9", "scikit-learn>=1.5", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The report and figures hold prose and chart captions; their long lines are sentences.
"src/kisti/analysis/report.py" = ["E501"]
"src/kisti/analysis/figures.py" = ["E501"]
