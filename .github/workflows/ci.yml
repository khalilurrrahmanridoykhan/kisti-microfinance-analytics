name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # package-lock.json is generated on macOS, and npm's lockfile only ever records a
      # resolved, integrity-checked entry for the *current* platform's optional native
      # binaries (Rollup, esbuild) — it cannot record one for a tarball it never downloaded.
      # `npm ci` (and even a lockfile-respecting `npm install`) then finds no Linux entry to
      # install and silently skips it, so the build fails at runtime instead of install time
      # (npm/cli#4828). Dropping the lockfile here makes npm resolve fresh for this platform,
      # still constrained by the version ranges in package.json; the committed lockfile keeps
      # pinning local, same-platform installs.
      - run: rm -f package-lock.json && npm install
      - run: npx eslint src
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: web/dist
      # A second build, with assets referenced from the domain root ("/...") instead of the
      # GitHub Pages subpath ("/kisti-microfinance-analytics/..."), for the custom-domain copy.
      - run: npx vite build --base=/ --outDir dist-vps
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: dist-vps
          path: web/dist-vps
          retention-days: 1

  # Deploys the dashboard built above to GitHub Pages. Only on pushes to main (never on a PR),
  # and only after both jobs above pass, so a broken build or a failing test is never published.
  deploy:
    needs: [test, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Deploys the same build to kisti.krrkhan.com over rsync/SSH, using a deploy key that is
  # restricted (via rrsync, see docs/dashboard-design.md) to only the dashboard's own directory
  # on that server. Runs after `deploy` so a Pages rollback would also block this.
  deploy-vps:
    needs: [test, web, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-vps
          path: dist-vps
      - run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KISTI_VPS_SSH_KEY }}" > ~/.ssh/kisti_deploy
          chmod 600 ~/.ssh/kisti_deploy
          ssh-keyscan -H "${{ secrets.KISTI_VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/kisti_deploy -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist-vps/ "${{ secrets.KISTI_VPS_USER }}@${{ secrets.KISTI_VPS_HOST }}:/"
